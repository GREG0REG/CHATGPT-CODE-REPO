plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

configurations.all {
    resolutionStrategy {
        eachDependency { details ->
            if (details.requested.group == 'androidx.work') {
                details.useVersion '2.8.1'
            }
        }
    }
}

android {
    namespace "com.example.event_countdown"
    compileSdk = 35
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId "com.example.event_countdown"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            keyAlias 'release'
            keyPassword 'releasepass'
            storeFile file('release-key.jks')
            storePassword 'releasepass'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // ============================================
            // OPTIMIZATION: Aggressive code & resource shrinking
            // ============================================
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            crunchPngs true
            
            packagingOptions {
                jniLibs {
                    useLegacyPackaging false
                }
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    // ============================================
    // OPTIMIZATION: Split APKs to reduce size
    // ============================================
    splits {
        // Split by ABI (CPU architecture)
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk true
        }
        
        // Split by screen density
        density {
            enable true
            exclude "ldpi", "tvdpi"
        }
        
        // REMOVED: Language splitting is deprecated/removed in AGP 8.x
        // Modern apps handle languages via Play Store Dynamic Delivery or App Bundles
    }

    lint {
        checkReleaseBuilds true
        disable 'InvalidPackage'
        textReport true
        textOutput "stdout"
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'androidx.work:work-runtime-ktx:2.8.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
