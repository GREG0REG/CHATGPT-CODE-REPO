name: event_countdown
description: "Event Countdown - local-only countdown widget app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  workmanager: ^0.5.2
  home_widget: ^0.7.0
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  share_plus: ^9.0.0
  dynamic_color: 1.7.0
  battery_plus: ^6.0.1
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  wakelock_plus: '1.2.10'
  permission_handler: ^11.3.1  
  intl: ^0.19.0
  flutter_slidable: ^3.1.1
  flutter_tts: ^4.0.2 
    
  
dependency_overrides:
  package_info_plus: '8.1.0'


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
