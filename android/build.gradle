allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
    
    // FIX: Inject a mock "flutter" extension into every plugin subproject
    // so that plugins referencing flutter.compileSdkVersion / flutter.namespace
    // don't crash under AGP 8.3. We skip the :app module because the real
    // Flutter Gradle plugin creates its own flutter extension there.
    if (project.name != "app" && project.extensions.findByName("flutter") == null) {
        project.extensions.create("flutter", FlutterExtension)
    }
    
    // FIX: Use plugins.withId — it fires immediately if the Android plugin
    // is already applied, so we never hit the "already evaluated" error.
    project.plugins.withId("com.android.application") {
        project.android {
            compileSdkVersion 35
            if (namespace == null) {
                namespace project.group
            }
        }
    }
    project.plugins.withId("com.android.library") {
        project.android {
            compileSdkVersion 35
            if (namespace == null) {
                namespace project.group
            }
        }
    }
}

// Mock class that supplies the properties plugins expect
class FlutterExtension {
    int compileSdkVersion = 35
    int minSdkVersion = 21
    int targetSdkVersion = 35
    String namespace = "com.example.placeholder"
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
